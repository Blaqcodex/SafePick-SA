<!-- ============================================================
     AcknowledgeSheetComponent — 5.9c
     ============================================================ -->

<div
  class="sheet-backdrop"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
  aria-labelledby="sheet-title">

  <div class="sheet" (click)="$event.stopPropagation()">

    <div class="sheet__handle" aria-hidden="true"></div>

    <div class="sheet__header">
      <h2 id="sheet-title" class="sheet__title">Acknowledge gap</h2>
      <p class="sheet__subtitle">{{ gap.learnerFullName }} · {{ gap.classGroup }}</p>
    </div>

    <p class="sheet__explain">
      Acknowledging this gap marks it as seen and puts it on your
      queue for investigation. You can then investigate or resolve it.
    </p>

    <div class="sheet__window">
      <mat-icon aria-hidden="true">schedule</mat-icon>
      <div>
        <div class="sheet__window-label">Expected window</div>
        <div class="sheet__window-value">
          {{ formatWindow(gap.expectedWindowStart, gap.expectedWindowEnd) }}
        </div>
      </div>
    </div>

    <div class="sheet__actions">
      <button
        type="button"
        class="sheet__button sheet__button--primary"
        [disabled]="submitting"
        (click)="onSubmit()">
        @if (submitting) {
          <mat-spinner diameter="20"></mat-spinner>
          <span>Acknowledging…</span>
        } @else {
          <span>Acknowledge</span>
        }
      </button>
      <button
        type="button"
        class="sheet__button sheet__button--secondary"
        [disabled]="submitting"
        (click)="onDismiss()">
        Back
      </button>
    </div>

  </div>
</div>
