name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test solution
        run: dotnet test SafePick.slnx --configuration Release

  frontend:
    name: Angular production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/safepick-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/safepick-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
